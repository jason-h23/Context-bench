[project]
name = "contextbench"
version = "0.1.0"
description = "Diagnose AI agent context files for redundancy, ambiguity, and token waste"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "anthropic>=0.49",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[project.scripts]
contextbench = "contextbench.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contextbench"]
